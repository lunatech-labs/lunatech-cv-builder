# ── PROFESSIONAL EXPERIENCE ──────────────────
experiences:
  - company: NeoBank Solutions
    role: Lead DevOps Engineer
    period: "Sep 2025 - present"
    description: >
      Context: NeoBank Solutions is a French neobank operating
      a microservices banking core on AWS EKS, serving 1.2M
      retail customers under PSD2 and DORA constraints.

      Responsibilities: technical lead of a 4-engineer platform
      squad, owning the internal developer platform, the GitOps
      delivery chain and the on-call rotation handoffs with the
      client SRE team. Direct interaction with the Head of
      Platform and the security officer on compliance topics.

      Key contributions: migrated 60+ services from Jenkins to
      ArgoCD with progressive delivery via Argo Rollouts, cutting
      mean deploy lead time from 45 minutes to 6 minutes; rolled
      out a Backstage portal that became the single entry point
      for service ownership and runbooks; introduced Karpenter
      on EKS, reducing monthly compute spend by 28% with no SLO
      regression.

      Source of pride: the Karpenter rollout, which closed a
      year-long FinOps gap that two previous teams had attempted.
    tags: [AWS, EKS, ArgoCD, Terraform, Backstage, Karpenter, Go]

  - company: Maison Lefèvre Retail
    role: Cloud Engineer
    period: "Mar 2024 - Aug 2025"
    description: >
      Context: Maison Lefèvre is a French retail group with a
      300-store network, modernizing its e-commerce stack for
      peak Black Friday traffic.

      Responsibilities: cloud architect and hands-on engineer
      inside a 6-person delivery team, working closely with the
      e-commerce product owner and the in-house network team.

      Key contributions: designed and implemented the multi-region
      GCP landing zone (Terraform, IAM, VPC service controls);
      built the autoscaling strategy on GKE that absorbed a 7x
      traffic peak on Black Friday with zero customer-visible
      incidents; co-led the cutover weekend from on-prem to GCP
      for the catalogue service.

      Source of pride: standing in the war room on Black Friday
      and watching dashboards stay green under the highest load
      the platform had ever served.
    tags: [GCP, GKE, Terraform, Cloud Run, Pub/Sub, Python]

  - company: Helios SaaS Platform
    role: Site Reliability Engineer
    period: "Jan 2023 - Feb 2024"
    description: >
      Context: Helios is a B2B SaaS platform for HR analytics
      with a multi-tenant Kubernetes architecture on AWS,
      serving 80 enterprise customers under strict SLA contracts.

      Responsibilities: SRE rotation on a 5-engineer team,
      ownership of the observability stack and of the post-incident
      review process, regular sync with the customer success team
      on customer-impacting incidents.

      Key contributions: rebuilt the Prometheus / Grafana / Loki
      stack to support 4x the previous metric volume without
      cost increase; introduced SLO-based alerting that reduced
      pager noise by 65%; ran 12 blameless postmortems and turned
      recurring patterns into a hardening backlog adopted by
      the product team.

      Source of pride: turning the on-call rotation from a feared
      shift into a routine one, with measurable drops in alert
      fatigue.
    tags: [AWS, Kubernetes, Prometheus, Grafana, Loki, Python]

  - company: Freelance - Atelier Verre & Lumière
    role: DevOps Consultant
    period: "Jun 2022 - Dec 2022"
    description: >
      Context: short freelance mission with a small art studio
      that needed a reliable hosting setup for its online shop
      and booking system.

      Responsibilities: sole engineer, direct contact with the
      studio owner, covering needs gathering, build and handover.

      Key contributions: containerized the legacy PHP shop and
      deployed it on a managed Kubernetes cluster with automated
      backups and TLS; documented the operations playbook so the
      owner could perform routine restarts and updates without
      external help.

      Source of pride: leaving the client fully autonomous on
      day-to-day operations, with a runbook they still use today.
    tags: [Docker, Kubernetes, NGINX, Let's Encrypt, Bash]

