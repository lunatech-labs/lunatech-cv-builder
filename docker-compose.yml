services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-builder-pg
    environment:
      POSTGRES_USER: cvbuilder
      POSTGRES_PASSWORD: cvbuilder
      POSTGRES_DB: cvbuilder
    ports:
      - "5433:5432"
    volumes:
      - cvbuilder_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbuilder -d cvbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvbuilder_pg:
