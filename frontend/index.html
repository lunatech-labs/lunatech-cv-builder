<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunatech CV Builder</title>
<link rel="icon" type="image/png" href="/assets/lunatech-logo-alone.png">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* ── UI theme vars — Lunatech (rouge / noir) ── */
  --ui-bg:      #0f0f10;
  --ui-surface: #1a1a1a;
  --ui-border:  #2e2e32;
  --ui-accent:  #c8102e;
  --ui-accent-deep: #7c1818;
  --ui-text:    #ece8e4;
  --ui-muted:   #8a8580;
  --ui-tab-active: #c8102e;
}
body { font-family: 'Poppins', sans-serif; background: var(--ui-bg); color: var(--ui-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background .3s, color .3s; }
.app-header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; border-bottom: 1px solid var(--ui-border); flex-shrink: 0; background: var(--ui-surface); transition: background .3s, border-color .3s; }
.app-logo { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: .04em; color: var(--ui-text); transition: color .3s; }
.app-logo-mark { width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.app-logo-text { display: flex; flex-direction: column; line-height: 1.1; }
.app-logo-brand { font-size: 14px; font-weight: 600; letter-spacing: .08em; color: var(--ui-accent); text-transform: uppercase; }
.app-logo-product { font-size: 11px; font-weight: 300; color: var(--ui-muted); letter-spacing: .04em; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 500; padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; transition: all .2s; letter-spacing: .04em; }
.btn-ghost { background: transparent; color: var(--ui-muted); border: 1px solid var(--ui-border); }
.btn-ghost:hover { color: var(--ui-text); border-color: var(--ui-accent); }
.btn-primary { background: var(--ui-accent); color: #fff; font-weight: 600; }
.btn-primary:hover { filter: brightness(1.1); }
.btn-export-bundle { background: transparent; color: var(--ui-accent); border: 1px solid var(--ui-accent); font-weight: 600; }
.btn-export-bundle:hover { background: var(--ui-accent); color: #fff; }

/* Persistence UI */
.cv-status { font-size: 11px; color: var(--ui-muted); padding: 0 6px; white-space: nowrap; font-style: italic; }
.cv-status.saved { color: var(--ui-accent); font-style: normal; }
.cv-status.dirty { color: #f9b550; }
.cv-select {
  font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 500;
  padding: 6px 10px; border-radius: 6px; cursor: pointer;
  background: transparent; color: var(--ui-muted); border: 1px solid var(--ui-border);
  letter-spacing: .04em; max-width: 220px;
}
.cv-select:hover { color: var(--ui-text); border-color: var(--ui-accent); }
.cv-select option { background: var(--ui-surface); color: var(--ui-text); }

/* Toggle photo button */
.toggle-wrap { display: flex; align-items: center; gap: 8px; }
.toggle-label { font-size: 11px; font-weight: 400; color: var(--ui-muted); letter-spacing: .03em; white-space: nowrap; }
.toggle-switch { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0;
  background: #313244;
  border-radius: 18px;
  cursor: pointer;
  transition: background .2s;
}
.toggle-track::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #6c7086;
  transition: transform .2s, background .2s;
}
.toggle-switch input:checked + .toggle-track { background: #313244; }
.toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: var(--ui-accent); }
.tab-bar { display: flex; gap: 2px; padding: 0 24px; background: var(--ui-surface); border-bottom: 1px solid var(--ui-border); flex-shrink: 0; }
.tab { font-size: 11px; font-weight: 400; padding: 10px 16px; color: var(--ui-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; letter-spacing: .06em; text-transform: uppercase; }
.tab:hover { color: var(--ui-text); }
.tab.active { color: var(--ui-tab-active); border-bottom-color: var(--ui-tab-active); }
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ── EDITOR PANEL ── */
.editor-panel { width: 50%; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--ui-border); background: #1e1e2e; }
.panel-header { padding: 10px 18px 8px; font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #6c7086; border-bottom: 1px solid #313244; flex-shrink: 0; background: #181825; }
.panel-section { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.panel-section.active { display: flex; }

/* The highlight+textarea stack */
.editor-wrap {
  flex: 1;
  position: relative;
  overflow: auto;
  min-height: 0;
  background: #1e1e2e;
}
.editor-highlight {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  min-height: 100%;
  padding: 14px 16px 14px 56px;
  font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.8;
  white-space: pre;
  word-break: normal;
  pointer-events: none;
  color: #cdd6f4;
  tab-size: 2;
}
.editor-textarea {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  min-height: 100%;
  padding: 14px 16px 14px 56px;
  font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.8;
  background: transparent;
  color: transparent;
  caret-color: #cba6f7;
  border: none;
  outline: none;
  resize: none;
  tab-size: 2;
  white-space: pre;
  overflow: hidden;
  spellcheck: false;
  z-index: 2;
}
/* line numbers */
.editor-gutter {
  position: absolute;
  top: 0; left: 0;
  width: 48px;
  padding: 14px 0;
  background: #181825;
  border-right: 1px solid #313244;
  pointer-events: none;
  z-index: 1;
}
.editor-gutter span {
  display: block;
  height: 1.8em;
  line-height: 1.8em;
  font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
  font-size: 11px;
  color: #45475a;
  text-align: right;
  padding-right: 10px;
}

.error-bar { padding: 7px 18px; font-size: 11px; color: #f38ba8; background: rgba(243,139,168,.08); border-top: 1px solid rgba(243,139,168,.2); display: none; flex-shrink: 0; }
.error-bar.visible { display: block; }
.css-hint { padding: 10px 18px; font-size: 11px; color: #6c7086; border-bottom: 1px solid #313244; line-height: 1.6; flex-shrink: 0; }
.css-hint strong { color: #cba6f7; font-weight: 500; }

/* YAML token colours — Catppuccin Mocha */
.hl-key     { color: #89b4fa; }
.hl-str     { color: #a6e3a1; }
.hl-num     { color: #fab387; }
.hl-bool    { color: #cba6f7; font-style: italic; }
.hl-comment { color: #6c7086; font-style: italic; }
.hl-dash    { color: #f38ba8; }
.hl-anchor  { color: #f5c2e7; }
/* CSS token colours */
.hl-sel     { color: #89dceb; }
.hl-prop    { color: #89b4fa; }
.hl-val     { color: #a6e3a1; }
.hl-at      { color: #cba6f7; font-style: italic; }
.hl-brace   { color: #6c7086; }

/* ── PREVIEW ── */
.preview-area { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 32px; background-image: linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%); background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; background-color: #888; }
#cv-frame-wrapper { background: white; box-shadow: 0 8px 48px rgba(0,0,0,.5); transform-origin: top center; overflow: hidden; }

/* ══════════════════════════════════════════════════════════
   CV TEMPLATE — layout cv-example.pdf (4 thèmes, mêmes styles)
   ══════════════════════════════════════════════════════════ */
#cv-root {
  /* base = thème lunatech */
  --cv-accent:       #7c1818;
  --cv-accent-light: #f4e9e9;
  --cv-header-bg:    #1a1a1a;
  --cv-bar-fill:     #7c1818;
  --cv-bar-empty:    #f0d8d8;
  --cv-text:         #1a1a1a;
  --cv-muted:        #6b6b6b;
  --cv-body:         #2a2a2a;
  --cv-border:       #d8d4d0;
  --cv-bullet:       #7c1818;
  width: 794px; height: 1123px; overflow: visible;
  font-family: 'Poppins', sans-serif; font-size: 12.5px; line-height: 1.55;
  color: var(--cv-text); background: white; position: relative;
  display: flex; flex-direction: column;
}
#cv-root[data-theme="lunatech"] {
  --cv-accent: #7c1818; --cv-accent-light: #f4e9e9;
  --cv-header-bg: #1a1a1a; --cv-bar-fill: #7c1818; --cv-bar-empty: #f0d8d8;
  --cv-bullet: #7c1818;
}
#cv-root[data-theme="luxe"] {
  --cv-accent: #0B0B0B; --cv-accent-light: #f5f0e8;
  --cv-header-bg: #0B0B0B; --cv-bar-fill: #c8a24a; --cv-bar-empty: #e8e2d4;
  --cv-bullet: #c8a24a; --cv-border: #e8e2d4;
}
#cv-root[data-theme="cosmic"] {
  --cv-accent: #0a1e50; --cv-accent-light: #fce7f3;
  --cv-header-bg: #0a1e50; --cv-bar-fill: #DB2777; --cv-bar-empty: #f0d8e8;
  --cv-bullet: #DB2777;
}
#cv-root[data-theme="opera"] {
  --cv-accent: #9b0f17; --cv-accent-light: #fdf2f2;
  --cv-header-bg: #9b0f17; --cv-bar-fill: #ea212e; --cv-bar-empty: #f5dede;
  --cv-bullet: #ea212e; --cv-border: #e8d8d8;
}

/* ── HEADER ── */
.cv-header {
  background: var(--cv-header-bg);
  color: #fff;
  padding: 38px 48px 28px;
  flex-shrink: 0;
  position: relative;
}
.cv-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.cv-header-left { flex: 1; min-width: 0; }
.cv-name {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-size: 38px; font-weight: 700;
  line-height: 1.1; letter-spacing: 0;
  margin-bottom: 8px;
}
.cv-subline { font-size: 11.5px; font-weight: 300; color: rgba(255,255,255,.78); letter-spacing: .01em; line-height: 1.5; }
.cv-subline-sep { color: rgba(255,255,255,.4); margin: 0 .55em; }
.cv-since { font-style: italic; font-size: 11px; color: rgba(255,255,255,.6); margin-top: 1px; }
.cv-header-right {
  text-align: right;
  font-size: 11px; font-weight: 300;
  color: rgba(255,255,255,.85);
  white-space: nowrap;
  line-height: 1.55;
  flex-shrink: 0;
}
.cv-contact { display: block; }
.cv-contact-icon { display: inline-block; opacity: .65; margin-right: 5px; font-style: normal; }
.cv-contact.strong { font-weight: 600; color: #fff; }

/* ── PHOTO (optionnel) ── */
.cv-photo-wrap {
  position: absolute;
  top: 28px; right: 48px;
  z-index: 20; cursor: pointer;
}
.cv-photo-circle {
  width: 96px; height: 96px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.85);
  background: rgba(255,255,255,.12);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s;
}
.cv-photo-circle:hover { opacity: .85; }
.cv-photo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cv-photo-placeholder { width: 48px; height: 48px; opacity: .55; fill: #fff; }
.cv-photo-wrap:hover .cv-photo-hint { opacity: 1; }
.cv-photo-hint {
  position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
  font-size: 7px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(255,255,255,.7); white-space: nowrap; opacity: 0; transition: opacity .15s;
  pointer-events: none;
}

/* ── BODY ── */
.cv-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.cv-col-main { width: 60%; padding: 22px 26px 0 48px; overflow: hidden; display: flex; flex-direction: column; }
.cv-col-side { width: 40%; padding: 22px 48px 0 22px; overflow: hidden; display: flex; flex-direction: column; }

/* ── SECTIONS ── */
.cv-section { margin-bottom: 14px; flex-shrink: 0; }
.cv-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 9.5px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--cv-text);
  padding-bottom: 4px; margin-bottom: 8px;
  border-bottom: 1px solid var(--cv-accent);
}
.cv-section-title::before {
  content: '◆';
  color: var(--cv-bullet);
  font-size: 9px;
  letter-spacing: 0;
}
.cv-section-title.bullet-diamond::before { content: '◇'; }
.cv-section-title.bullet-spark::before { content: '★'; font-size: 8.5px; }
.cv-section-title.bullet-arrow::before { content: '▸'; }

/* ── PROFILE / SUMMARY ── */
.cv-summary {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-size: 13px; font-style: italic; font-weight: 400;
  line-height: 1.45; color: var(--cv-body);
  margin-bottom: 12px;
}

/* ── EXPERIENCE — timeline marker on the left ── */
.cv-exp {
  display: grid;
  grid-template-columns: 38px 14px 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.cv-exp-period {
  text-align: center;
  font-size: 8.5px; font-style: italic;
  color: var(--cv-muted);
  line-height: 1.3;
  padding-top: 3px;
  white-space: pre-line;
}
.cv-exp-marker {
  color: var(--cv-bullet);
  font-size: 9px;
  text-align: center;
  padding-top: 2px;
}
.cv-exp-content { min-width: 0; }
.cv-exp-headline {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-size: 13px; font-weight: 700;
  line-height: 1.25; margin-bottom: 1px;
}
.cv-exp-headline .cv-exp-role { font-style: italic; font-weight: 500; }
.cv-exp-headline .cv-exp-sep { color: var(--cv-muted); font-weight: 400; margin: 0 .35em; }
.cv-exp-desc {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-style: italic; font-size: 11px;
  color: var(--cv-body); line-height: 1.45;
  margin-bottom: 4px;
}
.cv-tags {
  font-size: 9.5px; font-weight: 600;
  color: var(--cv-text);
  letter-spacing: .01em;
  line-height: 1.4;
}
.cv-tag-sep { color: var(--cv-bullet); margin: 0 .35em; }

/* ── SKILLS ── */
.cv-skill-row {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 12px; align-items: center;
  margin-bottom: 8px;
}
.cv-skill-name { font-size: 10px; color: var(--cv-text); }
.cv-skill-bar {
  position: relative; height: 5px;
  background: var(--cv-bar-empty);
  border-radius: 0;
}
.cv-skill-bar-fill {
  position: absolute; top: 0; bottom: 0; left: 0;
  background: var(--cv-bar-fill);
}
.cv-skill-group-sep { height: 6px; }

/* ── PROJECTS / CERTS / EDUCATION ── */
.cv-block { margin-bottom: 10px; }
.cv-block-title {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-size: 12px; font-weight: 700;
  line-height: 1.25; margin-bottom: 1px;
}
.cv-block-title .cv-block-sub { font-style: italic; font-weight: 500; }
.cv-block-title .cv-block-sep { color: var(--cv-muted); font-weight: 400; margin: 0 .35em; }
.cv-block-meta {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-style: italic; font-size: 10.5px;
  color: var(--cv-body);
  margin-bottom: 2px;
}
.cv-block-desc {
  font-family: 'EB Garamond', 'Garamond', serif;
  font-style: italic; font-size: 11px;
  color: var(--cv-body); line-height: 1.45;
  margin-bottom: 3px;
}

/* ── KEY ASSETS — full-width capsule under the header ── */
.cv-key-assets-capsule {
  background: var(--cv-accent-light);
  border-bottom: 1px solid var(--cv-accent);
  padding: 14px 48px 16px;
  flex-shrink: 0;
}
.cv-key-assets-capsule-title {
  font-size: 10px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--cv-accent);
  margin-bottom: 8px;
}
.cv-key-assets-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 28px;
  row-gap: 5px;
  list-style: none; padding: 0; margin: 0;
}
.cv-key-assets-grid li {
  font-size: 11.5px; font-weight: 500;
  color: var(--cv-text);
  padding-left: 14px; position: relative;
  line-height: 1.4;
}
.cv-key-assets-grid li::before {
  content: '◆';
  position: absolute; left: 0; top: 2px;
  color: var(--cv-bullet);
  font-size: 8px;
}

/* ── LANGUAGES ── */
.cv-lang-item { display: flex; justify-content: space-between; padding: 2px 0; font-size: 10px; }
.cv-lang-level { color: var(--cv-muted); font-style: italic; }

/* ── FOOTER ── */
.cv-footer-safe { flex-shrink: 0; padding: 0 48px; margin-top: auto; }
.cv-footer-line { border-top: 1px solid var(--cv-border); }
.cv-footer-text { padding: 6px 8px 8px; font-size: 7.5px; font-weight: 400; letter-spacing: .05em; color: var(--cv-muted); text-align: center; white-space: nowrap; }

/* ── TOGGLE PHOTO ── */
.toggle-wrap { display: flex; align-items: center; gap: 8px; }
.toggle-label { font-size: 11px; font-weight: 400; color: var(--ui-muted); letter-spacing: .03em; white-space: nowrap; }
.toggle-switch { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track { position: absolute; inset: 0; background: #313244; border-radius: 18px; cursor: pointer; transition: background .2s; }
.toggle-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #6c7086; transition: transform .2s, background .2s; }
.toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: var(--ui-accent); }

/* ── THEME SWITCHER ── */
.theme-switcher { display: flex; align-items: center; gap: 6px; }
.theme-label { font-size: 11px; font-weight: 400; color: var(--ui-muted); letter-spacing: .03em; white-space: nowrap; }
.theme-btn {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all .15s; position: relative; flex-shrink: 0;
}
.theme-btn:hover { transform: scale(1.15); }
.theme-btn.active { border-color: white; box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
.theme-btn-lunatech { background: linear-gradient(135deg, #1a1a1a 50%, #7c1818 50%); }
.theme-btn-luxe     { background: linear-gradient(135deg, #0B0B0B 50%, #c8a24a 50%); }
.theme-btn-cosmic   { background: linear-gradient(135deg, #0a1e50 50%, #DB2777 50%); }
.theme-btn-opera    { background: linear-gradient(135deg, #9b0f17 50%, #ea212e 50%); }

@page { size: A4; margin: 0; }
@media print {
  html, body { width: 210mm !important; height: auto !important; background: white !important; overflow: visible !important; }
  body > *:not(#print-portal) { display: none !important; }
  #print-portal { display: block !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
  #print-portal #cv-root { width: 210mm !important; height: 297mm !important; box-shadow: none !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

/* ── USER (Keycloak) ── */
.user-info {
  display: none; align-items: center; gap: 8px;
  padding-left: 12px; margin-left: 4px;
  border-left: 1px solid var(--ui-border);
}
.user-info.visible { display: inline-flex; }
.user-name { font-size: 11px; color: var(--ui-muted); font-weight: 500; letter-spacing: .03em; }

/* ── REVIEW WITH CLAUDE ── */
.review-score-badge {
  display: none; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  background: var(--ui-surface); border: 1px solid var(--ui-border);
  color: var(--ui-text); cursor: pointer;
}
.review-score-badge.visible { display: inline-flex; }
.review-score-badge .score-num { font-weight: 700; }
.review-score-badge.score-low    { border-color: #ef4444; color: #ef4444; }
.review-score-badge.score-mid    { border-color: #f59e0b; color: #f59e0b; }
.review-score-badge.score-high   { border-color: #10b981; color: #10b981; }
.btn-review { background: transparent; color: var(--ui-accent); border: 1px solid var(--ui-accent); font-weight: 600; }
.btn-review:hover { background: var(--ui-accent); color: #fff; }
.btn-review:disabled { opacity: 0.6; cursor: wait; }

.review-modal-bg {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.6); backdrop-filter: blur(2px);
  align-items: center; justify-content: center;
  padding: 32px;
}
.review-modal-bg.visible { display: flex; }
.review-modal {
  width: min(900px, 100%); max-height: calc(100vh - 64px);
  display: flex; flex-direction: column;
  background: var(--ui-surface); color: var(--ui-text);
  border: 1px solid var(--ui-border); border-radius: 10px;
  box-shadow: 0 24px 80px rgba(0,0,0,.5);
}
.review-modal-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px; border-bottom: 1px solid var(--ui-border);
  flex-shrink: 0;
}
.review-modal-title { font-size: 14px; font-weight: 600; letter-spacing: .04em; }
.review-modal-meta { display: flex; gap: 10px; align-items: center; margin-left: auto; }
.review-score-pill {
  padding: 5px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  border: 1px solid;
}
.review-score-pill.score-low  { color: #ef4444; border-color: #ef4444; }
.review-score-pill.score-mid  { color: #f59e0b; border-color: #f59e0b; }
.review-score-pill.score-high { color: #10b981; border-color: #10b981; }
.review-verdict-pill {
  padding: 5px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase;
  background: rgba(255,255,255,.05); color: var(--ui-muted);
  border: 1px solid var(--ui-border);
}
.review-modal-body {
  padding: 18px 26px 22px;
  overflow-y: auto; flex: 1;
  font-family: 'Poppins', sans-serif; font-size: 13px; line-height: 1.6;
  color: var(--ui-text);
}
.review-modal-body h1, .review-modal-body h2, .review-modal-body h3 {
  margin: 18px 0 8px; font-weight: 600; color: var(--ui-text);
}
.review-modal-body h1 { font-size: 18px; }
.review-modal-body h2 { font-size: 15px; color: var(--ui-accent); }
.review-modal-body h3 { font-size: 13px; }
.review-modal-body p { margin: 6px 0 10px; }
.review-modal-body ul, .review-modal-body ol { margin: 6px 0 10px; padding-left: 22px; }
.review-modal-body li { margin: 3px 0; }
.review-modal-body table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
.review-modal-body th, .review-modal-body td { padding: 6px 10px; border: 1px solid var(--ui-border); text-align: left; }
.review-modal-body th { background: rgba(255,255,255,.04); font-weight: 600; }
.review-modal-body code { font-family: 'Fira Code', monospace; font-size: 12px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 3px; }
.review-modal-body strong { color: var(--ui-text); }
.review-modal-footer {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 22px; border-top: 1px solid var(--ui-border);
  flex-shrink: 0;
}
.review-modal-footer .meta { font-size: 11px; color: var(--ui-muted); margin-right: auto; font-style: italic; }
.review-spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--ui-border); border-top-color: var(--ui-accent);
  border-radius: 50%; animation: spin .8s linear infinite;
  margin-right: 6px; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<style id="custom-cv-styles"></style>

<script>
// ══════════════════════════════════════════════════════════
// DEFAULT CONTENT
// ══════════════════════════════════════════════════════════
// Loaded from /assets/cv-empty.yaml at init.
var YAML_DEFAULT = '';

var CSS_DEFAULT = [
'/* ============================',
'   TEMPLATE VARIABLES (lunatech)',
'   ============================ */',
'#cv-root {',
'  --cv-accent:       #7c1818;',
'  --cv-accent-light: #f4e9e9;',
'  --cv-header-bg:    #1a1a1a;',
'  --cv-bar-fill:     #7c1818;',
'  --cv-bar-empty:    #f0d8d8;',
'  --cv-text:         #1a1a1a;',
'  --cv-muted:        #6b6b6b;',
'  --cv-body:         #2a2a2a;',
'  --cv-border:       #d8d4d0;',
'  --cv-bullet:       #7c1818;',
'}',
'',
'/* ============================',
'   ADD YOUR OWN RULES',
'   ============================ */'
].join('\n');

// ══════════════════════════════════════════════════════════
// SYNTAX HIGHLIGHTING (textarea + div overlay)
// ══════════════════════════════════════════════════════════
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightYaml(code) {
  return code.split('\n').map(function(line) {
    // comment
    if (/^\s*#/.test(line)) return '<span class="hl-comment">' + esc(line) + '</span>';
    var out = '';
    // leading dash
    var dashMatch = line.match(/^(\s*)(- )(.*)/);
    if (dashMatch) {
      out += esc(dashMatch[1]);
      out += '<span class="hl-dash">- </span>';
      line = dashMatch[3];
    } else {
      // key: value
      var kvMatch = line.match(/^(\s*)([^:]+?)(\s*:\s*)(.*)/);
      if (kvMatch) {
        out += esc(kvMatch[1]);
        out += '<span class="hl-key">' + esc(kvMatch[2]) + '</span>';
        out += '<span class="hl-brace">' + esc(kvMatch[3]) + '</span>';
        line = kvMatch[4];
      }
    }
    // value
    if (line !== undefined && line !== '') {
      if (/^".*"$/.test(line.trim()) || /^'.*'$/.test(line.trim())) {
        out += '<span class="hl-str">' + esc(line) + '</span>';
      } else if (/^\[.*\]$/.test(line.trim())) {
        // inline array — highlight each item
        out += '<span class="hl-brace">[</span>' +
          line.trim().slice(1,-1).split(',').map(function(item) {
            return '<span class="hl-str">' + esc(item) + '</span>';
          }).join('<span class="hl-brace">,</span>') +
          '<span class="hl-brace">]</span>';
      } else if (/^(true|false|yes|no|null|~)$/i.test(line.trim())) {
        out += '<span class="hl-bool">' + esc(line) + '</span>';
      } else if (/^-?\d/.test(line.trim())) {
        out += '<span class="hl-num">' + esc(line) + '</span>';
      } else if (line.trim() === '>') {
        out += '<span class="hl-anchor">' + esc(line) + '</span>';
      } else {
        out += esc(line);
      }
    }
    return out;
  }).join('\n');
}

function highlightCss(code) {
  return code.split('\n').map(function(line) {
    if (/^\s*\/\*/.test(line) || /^\s*\*/.test(line)) return '<span class="hl-comment">' + esc(line) + '</span>';
    if (/^\s*}/.test(line)) return '<span class="hl-brace">' + esc(line) + '</span>';
    if (/^\s*@/.test(line)) return '<span class="hl-at">' + esc(line) + '</span>';
    var propMatch = line.match(/^(\s*)([\w-]+)(\s*:\s*)(.*)/);
    if (propMatch) {
      return esc(propMatch[1]) +
        '<span class="hl-prop">' + esc(propMatch[2]) + '</span>' +
        '<span class="hl-brace">' + esc(propMatch[3]) + '</span>' +
        '<span class="hl-val">' + esc(propMatch[4]) + '</span>';
    }
    if (/{/.test(line)) return '<span class="hl-sel">' + esc(line) + '</span>';
    return esc(line);
  }).join('\n');
}

function buildGutter(lineCount) {
  var html = '';
  for (var i = 1; i <= lineCount; i++) html += '<span>' + i + '</span>';
  return html;
}

function syncScroll(wrap, textarea, highlight, gutter) {
  var scrollTop = textarea.scrollTop;
  var scrollLeft = textarea.scrollLeft;
  highlight.style.top = -scrollTop + 'px';
  highlight.style.left = (-scrollLeft) + 'px';
  gutter.style.top = -scrollTop + 'px';
}

function attachEditor(textareaId, highlightId, gutterId, wrapId, highlightFn, onChangeFn) {
  var ta  = document.getElementById(textareaId);
  var hl  = document.getElementById(highlightId);
  var gt  = document.getElementById(gutterId);
  var wp  = document.getElementById(wrapId);

  function refresh() {
    var val = ta.value;
    var lines = val.split('\n');
    hl.innerHTML = highlightFn(val);
    gt.innerHTML = buildGutter(lines.length);
    // Match textarea size to content
    ta.style.height = 'auto';
    ta.style.height = Math.max(wp.clientHeight, ta.scrollHeight) + 'px';
    hl.style.height  = ta.style.height;
    gt.style.height  = ta.style.height;
    if (onChangeFn) onChangeFn();
  }

  ta.value = textareaId === 'yaml-editor' ? YAML_DEFAULT : CSS_DEFAULT;
  ta.addEventListener('input', refresh);
  ta.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0,s) + '  ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
      refresh();
    }
  });
  ta.addEventListener('scroll', function() { syncScroll(wp, ta, hl, gt); });

  refresh();
}

// ══════════════════════════════════════════════════════════
// RENDER CV
// ══════════════════════════════════════════════════════════
function renderCV(data) {
  var root = document.getElementById('cv-root');

  // ── Header (left) ──
  var subline = data.title || '';
  var sinceLine = '';
  if (data.lunatech_since) {
    sinceLine = (data.years_experience ? data.years_experience + ' years of experience · ' : '') +
                'Lunatech — since ' + data.lunatech_since;
  }

  // ── Header (right contacts) ──
  var email = data.email || 'info@lunatech.fr';
  var headerContacts = [
    '<span class="cv-contact"><i class="cv-contact-icon">✉</i>' + email + '</span>',
    data.availability ? '<span class="cv-contact strong"><i class="cv-contact-icon">◎</i>Available : ' + data.availability + '</span>' : '',
    data.location    ? '<span class="cv-contact"><i class="cv-contact-icon">⌖</i>' + data.location + '</span>' : ''
  ].filter(Boolean).join('');

  // ── Experience timeline ──
  function tagsHtml(tags) {
    if (!tags || !tags.length) return '';
    return '<div class="cv-tags">' +
      tags.map(esc).join('<span class="cv-tag-sep">·</span>') +
    '</div>';
  }
  var experiences = (data.experiences||[]).map(function(exp) {
    var headline = '<span>' + (exp.company||'') + '</span>' +
                   (exp.role ? '<span class="cv-exp-sep">·</span><span class="cv-exp-role">' + exp.role + '</span>' : '');
    return '<div class="cv-exp">' +
             '<div class="cv-exp-period">' + (exp.period || '') + '</div>' +
             '<div class="cv-exp-marker">◆</div>' +
             '<div class="cv-exp-content">' +
               '<div class="cv-exp-headline">' + headline + '</div>' +
               (exp.description ? '<div class="cv-exp-desc">' + exp.description + '</div>' : '') +
               tagsHtml(exp.tags) +
             '</div>' +
           '</div>';
  }).join('');

  // ── Skills (single-bar) ──
  var skillsHtml = '';
  (data.skills||[]).forEach(function(g, gi) {
    (g.items||[]).forEach(function(item) {
      var name  = typeof item === 'string' ? item : item.name;
      var level = typeof item === 'string' ? 3 : (item.level || 3);
      var pct = Math.max(0, Math.min(5, level)) / 5 * 100;
      skillsHtml += '<div class="cv-skill-row">' +
                      '<div class="cv-skill-name">' + name + '</div>' +
                      '<div class="cv-skill-bar"><div class="cv-skill-bar-fill" style="width:' + pct + '%"></div></div>' +
                    '</div>';
    });
    if (gi < (data.skills||[]).length - 1) skillsHtml += '<div class="cv-skill-group-sep"></div>';
  });

  // ── Personal projects ──
  var projects = (data.projects||[]).map(function(p) {
    var headline = '<span>' + (p.name||'') + '</span>' +
                   (p.subtitle ? '<span class="cv-block-sep">—</span><span class="cv-block-sub">' + p.subtitle + '</span>' : '');
    return '<div class="cv-block">' +
             '<div class="cv-block-title">' + headline + '</div>' +
             (p.description ? '<div class="cv-block-desc">' + p.description + '</div>' : '') +
             tagsHtml(p.tags) +
           '</div>';
  }).join('');

  // ── Certifications ──
  var certifications = (data.certifications||[]).map(function(c) {
    var meta = [c.subtitle, c.issuer, c.year].filter(Boolean).join(' · ');
    return '<div class="cv-block">' +
             '<div class="cv-block-title">' + (c.name||'') + '</div>' +
             (meta ? '<div class="cv-block-meta">' + meta + '</div>' : '') +
           '</div>';
  }).join('');

  // ── Education ──
  var education = (data.education||[]).map(function(e) {
    var title = e.degree || e.school || '';
    var metaParts = [];
    if (e.school && e.school !== title) metaParts.push(e.school);
    if (e.year) metaParts.push(e.year);
    var meta = metaParts.join(' · ');
    return '<div class="cv-block">' +
             '<div class="cv-block-title">' + title + '</div>' +
             (meta ? '<div class="cv-block-meta">' + meta + '</div>' : '') +
           '</div>';
  }).join('');

  // ── Key assets ──
  var assets = data.key_assets || [];
  var keyAssetsCapsule = assets.length
    ? '<div class="cv-key-assets-capsule">' +
        '<div class="cv-key-assets-capsule-title">Key Assets' + (data.client_name ? ' for ' + data.client_name : '') + '</div>' +
        '<ul class="cv-key-assets-grid">' + assets.map(function(a){return '<li>' + a + '</li>';}).join('') + '</ul>' +
      '</div>'
    : '';

  // ── Languages ──
  var languages = (data.languages||[]).map(function(l) {
    return '<div class="cv-lang-item"><span>' + (l.language||'') + '</span><span class="cv-lang-level">' + (l.level||'') + '</span></div>';
  }).join('');

  var footer = 'Lunatech France &nbsp;&nbsp;&#124;&nbsp;&nbsp; 3 rue de la Galmy 77700 Chessy, France &nbsp;&nbsp;&#124;&nbsp;&nbsp; +33 1 82 88 56 64 &nbsp;&nbsp;&#124;&nbsp;&nbsp; info@lunatech.fr';

  root.innerHTML =
    '<div class="cv-header">' +
      '<div class="cv-header-row">' +
        '<div class="cv-header-left">' +
          '<div class="cv-name">' + (data.name||'First Last') + '</div>' +
          (subline   ? '<div class="cv-subline">' + subline + '</div>' : '') +
          (sinceLine ? '<div class="cv-since">' + sinceLine + '</div>' : '') +
        '</div>' +
        '<div class="cv-header-right">' + headerContacts + '</div>' +
      '</div>' +
      '<div class="cv-photo-wrap" id="cv-photo-wrap" title="Click to change photo">' +
        '<div class="cv-photo-circle" id="cv-photo-circle">' +
          '<svg class="cv-photo-placeholder" viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>' +
        '</div>' +
        '<span class="cv-photo-hint">Change photo</span>' +
      '</div>' +
    '</div>' +
    keyAssetsCapsule +
    '<div class="cv-body">' +
      '<div class="cv-col-main">' +
        (data.summary ? '<div class="cv-section"><div class="cv-section-title">Profile</div><div class="cv-summary">' + data.summary + '</div></div>' : '') +
        (experiences ? '<div class="cv-section"><div class="cv-section-title">Experience</div>' + experiences + '</div>' : '') +
      '</div>' +
      '<div class="cv-col-side">' +
        (skillsHtml ? '<div class="cv-section"><div class="cv-section-title">Skills</div>' + skillsHtml + '</div>' : '') +
        (projects ? '<div class="cv-section"><div class="cv-section-title bullet-spark">Personal Project</div>' + projects + '</div>' : '') +
        (certifications ? '<div class="cv-section"><div class="cv-section-title bullet-spark">Certifications</div>' + certifications + '</div>' : '') +
        (education ? '<div class="cv-section"><div class="cv-section-title bullet-diamond">Education</div>' + education + '</div>' : '') +
        (languages ? '<div class="cv-section"><div class="cv-section-title">Languages</div>' + languages + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="cv-footer-safe"><div class="cv-footer-line"></div><div class="cv-footer-text">' + footer + '</div></div>';

  if (currentPhotoDataUrl) applyPhoto(currentPhotoDataUrl);
  togglePhoto();
}

// ══════════════════════════════════════════════════════════
// THEME SWITCHER
// ══════════════════════════════════════════════════════════
// UI palette per CV theme — drives the builder chrome
var THEME_UI = {
  lunatech: {
    bg: '#0f0f10', surface: '#1a1a1a', border: '#2e2e32',
    accent: '#c8102e', text: '#ece8e4', muted: '#8a8580', tab: '#c8102e'
  },
  luxe: {
    bg: '#0a0905', surface: '#16130c', border: '#2e2a1e',
    accent: '#c8a24a', text: '#f0ead8', muted: '#7a7060', tab: '#c8a24a'
  },
  cosmic: {
    bg: '#0a0a14', surface: '#13131e', border: '#22223a',
    accent: '#DB2777', text: '#e8e4f0', muted: '#7a7592', tab: '#DB2777'
  },
  opera: {
    bg: '#100808', surface: '#1c1010', border: '#321818',
    accent: '#ea212e', text: '#ede8e6', muted: '#7a6a68', tab: '#ea212e'
  }
};

var currentTheme = 'lunatech';

function setTheme(theme) {
  currentTheme = theme;

  // ── CV template theme ──
  var root = document.getElementById('cv-root');
  if (root) root.setAttribute('data-theme', theme);

  // ── UI palette ──
  var ui = THEME_UI[theme] || THEME_UI.lunatech;
  var docRoot = document.documentElement;
  docRoot.style.setProperty('--ui-bg',         ui.bg);
  docRoot.style.setProperty('--ui-surface',    ui.surface);
  docRoot.style.setProperty('--ui-border',     ui.border);
  docRoot.style.setProperty('--ui-accent',     ui.accent);
  docRoot.style.setProperty('--ui-text',       ui.text);
  docRoot.style.setProperty('--ui-muted',      ui.muted);
  docRoot.style.setProperty('--ui-tab-active', ui.tab);

  // ── Active dot ──
  document.querySelectorAll('.theme-btn').forEach(function(b) { b.classList.remove('active'); });
  var active = document.querySelector('.theme-btn-' + theme);
  if (active) active.classList.add('active');
}

// ══════════════════════════════════════════════════════════
// PHOTO TOGGLE
// ══════════════════════════════════════════════════════════
var photoVisible = false;

function togglePhoto() {
  photoVisible = document.getElementById('toggle-photo').checked;
  var wrap = document.getElementById('cv-photo-wrap');
  if (wrap) wrap.style.display = photoVisible ? '' : 'none';
}
var currentPhotoDataUrl = null;
var photoInput = document.createElement('input');
photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.style.display = 'none';
document.body.appendChild(photoInput);
function applyPhoto(dataUrl) {
  currentPhotoDataUrl = dataUrl;
  var c = document.getElementById('cv-photo-circle');
  if (c) c.innerHTML = '<img src="'+dataUrl+'" alt="Profile photo" style="width:100%;height:100%;object-fit:cover;display:block;">';
}
photoInput.addEventListener('change', function() {
  var file = photoInput.files && photoInput.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function(e) { applyPhoto(e.target.result); };
  r.readAsDataURL(file);
  photoInput.value = '';
});
document.addEventListener('click', function(e) {
  if (e.target.closest && e.target.closest('#cv-photo-wrap')) photoInput.click();
});

// ══════════════════════════════════════════════════════════
// UPDATE / TAB / EXPORT
// ══════════════════════════════════════════════════════════
function updateCV() {
  var raw = document.getElementById('yaml-editor').value;
  var errBar = document.getElementById('yaml-error');
  try {
    var data = jsyaml.load(raw);
    errBar.classList.remove('visible');
    renderCV(data);
  } catch(e) {
    errBar.textContent = 'Invalid YAML — ' + e.message.split('\n')[0];
    errBar.classList.add('visible');
  }
  refreshStatus();
}

function updateCSS() {
  document.getElementById('custom-cv-styles').textContent = document.getElementById('css-editor').value;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab===tab); });
  document.querySelectorAll('.panel-section').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('tab-'+tab).classList.add('active');
}

// ── Backend persistence ──
var currentCvId = null;
var savedYaml = null;

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setStatus(state, msg) {
  var el = document.getElementById('cv-status');
  el.classList.remove('saved', 'dirty');
  if (state) el.classList.add(state);
  el.textContent = msg;
}

function refreshStatus() {
  var current = document.getElementById('yaml-editor').value;
  if (!currentCvId) {
    setStatus('', 'Unsaved');
    return;
  }
  if (savedYaml !== null && current !== savedYaml) {
    setStatus('dirty', 'Modified');
  } else {
    setStatus('saved', 'Saved');
  }
}

async function refreshCvList() {
  try {
    var res = await fetch('/api/cvs');
    if (!res.ok) return;
    var list = await res.json();
    var sel = document.getElementById('cv-list');
    var opts = ['<option value="">Open saved CV…</option>'];
    list.forEach(function(cv) {
      var date = new Date(cv.updated_at).toLocaleDateString();
      var label = (cv.name || '(unnamed)') + ' — ' + date;
      var sel = cv.id === currentCvId ? ' selected' : '';
      opts.push('<option value="' + cv.id + '"' + sel + '>' + escapeHtml(label) + '</option>');
    });
    sel = document.getElementById('cv-list');
    sel.innerHTML = opts.join('');
    if (currentCvId) sel.value = currentCvId;
  } catch (e) {
    console.error('refreshCvList', e);
  }
}

async function loadCv(id) {
  if (!id) return;
  try {
    var res = await fetch('/api/cvs/' + id);
    if (!res.ok) { alert('Load failed'); return; }
    var cv = await res.json();
    var ta = document.getElementById('yaml-editor');
    ta.value = cv.yaml;
    currentCvId = cv.id;
    savedYaml = cv.yaml;
    // Reviews are session-only, so a freshly loaded CV starts with none.
    clearReviewState();
    ta.dispatchEvent(new Event('input'));
    refreshStatus();
  } catch (e) {
    alert('Load failed: ' + e.message);
  }
}

async function saveCv() {
  var yaml = document.getElementById('yaml-editor').value;
  try {
    if (currentCvId) {
      var res = await fetch('/api/cvs/' + currentCvId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ yaml: yaml })
      });
      if (!res.ok) throw new Error(await res.text());
    } else {
      var res = await fetch('/api/cvs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ yaml: yaml })
      });
      if (!res.ok) throw new Error(await res.text());
      var data = await res.json();
      currentCvId = data.id;
    }
    savedYaml = yaml;
    await refreshCvList();
    refreshStatus();
    return true;
  } catch (e) {
    alert('Save failed: ' + e.message);
    return false;
  }
}

function newCv() {
  clearReviewState();
  var current = document.getElementById('yaml-editor').value;
  if (savedYaml !== current && !confirm('Discard unsaved changes and start a new CV?')) return;
  var ta = document.getElementById('yaml-editor');
  ta.value = YAML_DEFAULT;
  currentCvId = null;
  savedYaml = null;
  ta.dispatchEvent(new Event('input'));
  document.getElementById('cv-list').value = '';
  refreshStatus();
}

async function deleteCv() {
  if (!currentCvId) { alert('No CV loaded.'); return; }
  if (!confirm('Delete this CV permanently?')) return;
  try {
    var res = await fetch('/api/cvs/' + currentCvId, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    currentCvId = null;
    savedYaml = null;
    clearReviewState();
    var ta = document.getElementById('yaml-editor');
    ta.value = YAML_DEFAULT;
    ta.dispatchEvent(new Event('input'));
    await refreshCvList();
    refreshStatus();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

async function exportPDF() {
  // Persist before exporting so the server has the latest YAML
  var ok = await saveCv();
  if (!ok || !currentCvId) return;
  var url = '/api/cvs/' + currentCvId + '/pdf?theme=' + encodeURIComponent(currentTheme);
  window.open(url, '_blank');
}

function copyYaml() {
  navigator.clipboard.writeText(document.getElementById('yaml-editor').value);
  var btn = document.querySelector('.btn-ghost');
  var orig = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(function(){ btn.textContent = orig; }, 1800);
}

function scalePreview() {
  var area = document.getElementById('preview-area');
  var wrapper = document.getElementById('cv-frame-wrapper');
  var scaleW = (area.clientWidth - 64) / 794;
  var scaleH = (area.clientHeight - 64) / 1123;
  var scale = Math.min(1, scaleW, scaleH);
  wrapper.style.transform = 'scale('+scale+')';
  wrapper.style.transformOrigin = 'top center';
  wrapper.style.marginBottom = scale < 1 ? ((scale-1)*1123)+'px' : '0';
}
window.addEventListener('resize', scalePreview);

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
(async function init() {
  // Auth must be ready before any /api/* call below — bootstrap returns null
  // when the backend is in dev mode (no Keycloak vars), which is fine.
  try {
    var kc = await bootstrapAuth();
    if (kc) {
      window.kc = kc;
      installAuthFetch(kc);
      setUserBadge(kc);
    }
  } catch (e) {
    // Surface as much as possible — keycloak-js error objects often have a
    // useful `.error_description` or wrap the underlying response status.
    console.error('Auth bootstrap failed:', e);
    var detail = (e && (e.error_description || e.error || e.message)) || String(e);
    alert('Authentication failed: ' + detail + '\n\nCheck the browser console for details.');
    return;
  }

  try {
    var res = await fetch('/assets/cv-empty.yaml');
    if (res.ok) YAML_DEFAULT = await res.text();
  } catch (_) {}
  attachEditor('yaml-editor', 'hl-yaml', 'gutter-yaml', 'wrap-yaml', highlightYaml, updateCV);
  attachEditor('css-editor',  'hl-css',  'gutter-css',  'wrap-css',  highlightCss,  updateCSS);
  setTheme('lunatech');
  scalePreview();
  refreshStatus();
  refreshCvList();
})();

// ══════════════════════════════════════════════════════════
// AUTHENTICATION (Keycloak via OIDC)
// ══════════════════════════════════════════════════════════
// Boot order:
//   1. fetch /api/config  (always public, advertises whether Keycloak is on)
//   2. if Keycloak configured → load keycloak-js → init with login-required
//   3. wrap window.fetch to attach Bearer to /api/* calls (except /api/config)
//   4. populate the user header
// If the backend is in dev mode (no Keycloak vars), we skip all of this and
// behave exactly as before — fetch stays untouched, no login redirect.

window.kc = null;

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('Failed to load ' + src)); };
    document.head.appendChild(s);
  });
}

// keycloak-js v26 is ES-module-only; we dynamic-import it from jsdelivr and
// hoist the default export onto window so the rest of the code can call
// `new Keycloak(...)` as if it had been loaded as a UMD.
async function loadKeycloakJs(_serverUrl) {
  var mod = await import('https://cdn.jsdelivr.net/npm/keycloak-js@26/lib/keycloak.js');
  window.Keycloak = mod.default;
  console.info('keycloak-js: loaded v26 ESM from jsdelivr');
}

async function bootstrapAuth() {
  var cfg;
  try {
    cfg = await fetch('/api/config').then(function(r) { return r.json(); });
  } catch (e) {
    console.error('Could not fetch /api/config:', e);
    return null;
  }
  if (!cfg.keycloak) return null;

  await loadKeycloakJs(cfg.keycloak.url);

  var kc = new Keycloak({
    url: cfg.keycloak.url,
    realm: cfg.keycloak.realm,
    clientId: cfg.keycloak.client_id,
  });

  await kc.init({
    onLoad: 'login-required',
    pkceMethod: 'S256',
    checkLoginIframe: false,
    // Pin the redirect URI to the app root — leaving it implicit means
    // keycloak-js sends `window.location.href`, which on the post-login
    // round-trip can include leftover state and trip up redirect-URI matching.
    redirectUri: window.location.origin + '/',
  });

  // Auto-renew on expiry — gives the next fetch a valid token without us
  // having to await updateToken on every call (we still call it as a belt).
  kc.onTokenExpired = function() {
    kc.updateToken(30).catch(function() {
      console.warn('Token refresh failed, redirecting to login');
      kc.login();
    });
  };

  return kc;
}

function installAuthFetch(kc) {
  var originalFetch = window.fetch;
  window.fetch = async function(input, opts) {
    opts = opts || {};
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    // /api/config is intentionally public — sending a Bearer to it is harmless
    // but we skip it to avoid a redirect loop if the token has just expired.
    if (url.indexOf('/api/') === 0 && url !== '/api/config') {
      try { await kc.updateToken(30); } catch (_) {}
      var headers = new Headers(opts.headers || (input && input.headers) || {});
      headers.set('Authorization', 'Bearer ' + kc.token);
      opts.headers = headers;
    }
    return originalFetch(input, opts);
  };
}

function setUserBadge(kc) {
  var p = kc.tokenParsed || {};
  var name = p.name || p.preferred_username || p.email || 'Authenticated';
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-info').classList.add('visible');
}

function logout() {
  if (window.kc) window.kc.logout({ redirectUri: window.location.origin });
}

// ══════════════════════════════════════════════════════════
// REVIEW WITH CLAUDE
// ══════════════════════════════════════════════════════════
var cachedReview = null;       // last review object (from server) for the loaded CV
var cachedReviewAt = null;     // ISO timestamp from the server, when known

function scoreClass(score) {
  if (score >= 8) return 'score-high';
  if (score >= 5) return 'score-mid';
  return 'score-low';
}

function verdictLabel(verdict) {
  if (verdict === 'client_ready')         return 'Client ready';
  if (verdict === 'minor_improvements')   return 'Minor improvements';
  if (verdict === 'major_rework')         return 'Major rework';
  return verdict || '';
}

function refreshReviewBadge() {
  var badge = document.getElementById('review-score-badge');
  if (!cachedReview) { badge.classList.remove('visible'); return; }
  badge.classList.remove('score-low', 'score-mid', 'score-high');
  badge.classList.add(scoreClass(cachedReview.overall_score));
  document.getElementById('review-score-num').textContent = cachedReview.overall_score;
  badge.classList.add('visible');
}

function clearReviewState() {
  cachedReview = null;
  cachedReviewAt = null;
  refreshReviewBadge();
}

function openReviewModal(review, ts) {
  document.getElementById('review-modal-score').textContent = review.overall_score + ' / 10';
  document.getElementById('review-modal-score').className = 'review-score-pill ' + scoreClass(review.overall_score);
  document.getElementById('review-modal-verdict').textContent = verdictLabel(review.verdict);
  document.getElementById('review-modal-body').innerHTML = marked.parse(review.report_markdown || '');
  document.getElementById('review-modal-applybtn').style.display = (review.improved_yaml || '').trim() ? 'inline-block' : 'none';
  document.getElementById('review-modal-meta').textContent = ts ? ('Reviewed ' + new Date(ts).toLocaleString()) : '';
  document.getElementById('review-modal-bg').classList.add('visible');
  // stash for "apply"
  window.__currentReview = review;
}

function openReviewModalFromCache() {
  if (cachedReview) openReviewModal(cachedReview, cachedReviewAt);
}

function closeReviewModal() {
  document.getElementById('review-modal-bg').classList.remove('visible');
}

async function runReview() {
  // Stateless — sends the editor's YAML directly to the backend, no DB write.
  // The user can iterate on a draft without committing it.
  var yaml = document.getElementById('yaml-editor').value;
  if (!yaml.trim()) { alert('The editor is empty — nothing to review.'); return; }
  var btn = document.getElementById('btn-review');
  var originalText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="review-spinner"></span>Reviewing…';
  try {
    var res = await fetch('/api/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ yaml: yaml })
    });
    if (res.status === 503) {
      alert('Review unavailable: ANTHROPIC_API_KEY is not set on the server.');
      return;
    }
    if (!res.ok) throw new Error(await res.text());
    cachedReview = await res.json();
    cachedReviewAt = new Date().toISOString();
    refreshReviewBadge();
    openReviewModal(cachedReview, cachedReviewAt);
  } catch (e) {
    alert('Review failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function applyImprovedYaml() {
  var review = window.__currentReview;
  if (!review || !review.improved_yaml) return;
  if (!confirm('Replace the editor with the improved YAML? You can still Save or undo by reloading.')) return;
  var ta = document.getElementById('yaml-editor');
  ta.value = review.improved_yaml;
  ta.dispatchEvent(new Event('input'));
  closeReviewModal();
}

</script>

<div class="review-modal-bg" id="review-modal-bg" onclick="if(event.target===this) closeReviewModal()">
  <div class="review-modal">
    <div class="review-modal-header">
      <span class="review-modal-title">CV Review</span>
      <div class="review-modal-meta">
        <span class="review-verdict-pill" id="review-modal-verdict">—</span>
        <span class="review-score-pill" id="review-modal-score">—</span>
      </div>
    </div>
    <div class="review-modal-body" id="review-modal-body"></div>
    <div class="review-modal-footer">
      <span class="meta" id="review-modal-meta"></span>
      <button class="btn btn-ghost" id="review-modal-applybtn" onclick="applyImprovedYaml()">Apply improved YAML</button>
      <button class="btn btn-ghost" onclick="runReview()">Re-run</button>
      <button class="btn btn-primary" onclick="closeReviewModal()">Close</button>
    </div>
  </div>
</div>

</body>
